[versions]
kotlin = "2.4.10"
shadow = "9.6.1"
ffmpeg = "8.0.1-1.5.13"
javacv = "1.5.14"
jline = "4.1.3"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[libraries]
ffmpeg = { group = "org.bytedeco", name = "ffmpeg-platform", version.ref = "ffmpeg" }
javacv = { group = "org.bytedeco", name = "javacv", version.ref = "javacv" }
jline = { group = "org.jline", name = "jline", version.ref = "jline" }